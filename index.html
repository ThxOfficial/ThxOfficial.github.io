<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="nav-glass" id="navbar">
    <div class="nav-inner">
      <a href="#home" class="nav-brand">Logo</a>
      <ul class="nav-links">
        <li><a href="#home" class="nav-link active">首页</a></li>
        <li><a href="#categories" class="nav-link">分类</a></li>
        <li><a href="#articles" class="nav-link">文章</a></li>
      </ul>
    </div>
  </nav>

  <section id="home" class="hero-section">
    <div class="hero-bg base-bg"></div>
    <div class="hero-bg reveal-bg" id="revealBg"></div>
    <canvas id="spotlightCanvas" class="spotlight-canvas"></canvas>
    <div class="hero-content">
      <div class="avatar-placeholder">
        <img src="pics/avatar.jpg" alt="头像" class="avatar-img">
      </div>
      <h1 class="hero-title">Welcome</h1>
      <p class="hero-subtitle">Hover to explore</p>
      <div class="hero-scroll-hint">
        <span class="scroll-arrow"></span>
      </div>
    </div>
  </section>

  <section id="categories" class="section-panel">
    <div class="section-header">
      <span class="section-tag">分类</span>
      <h2 class="section-title">Categories</h2>
    </div>
    <div class="card-grid">
      <!-- 分类卡片由 content.js 自动渲染 -->
    </div>
  </section>

  <section id="articles" class="section-panel">
    <div class="section-header">
      <span class="section-tag">文章</span>
      <h2 class="section-title">Articles</h2>
    </div>
    <div class="article-list">
      <!-- 文章列表由 content.js 自动渲染 -->
    </div>
  </section>

  <footer class="footer-glass">
    <p>&copy; 2026</p>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
