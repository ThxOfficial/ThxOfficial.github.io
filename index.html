<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="nav-glass" id="navbar">
    <div class="nav-inner">
      <a href="#home" class="nav-brand">Logo</a>
      <ul class="nav-links">
        <li><a href="#home" class="nav-link active">首页</a></li>
        <li><a href="#categories" class="nav-link">分类</a></li>
      </ul>
    </div>
  </nav>

  <section id="home" class="hero-section">
    <div class="hero-bg base-bg"></div>
    <div class="hero-bg reveal-bg" id="revealBg"></div>
    <canvas id="spotlightCanvas" class="spotlight-canvas"></canvas>
    <div class="hero-content">
      <div class="avatar-placeholder">
        <svg viewBox="0 0 120 120" class="avatar-icon">
          <circle cx="60" cy="45" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
          <ellipse cx="60" cy="95" rx="36" ry="22" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <h1 class="hero-title">Welcome</h1>
      <p class="hero-subtitle">Hover to explore</p>
      <div class="hero-scroll-hint">
        <span class="scroll-arrow"></span>
      </div>
    </div>
  </section>

  <section id="categories" class="section-panel">
    <div class="section-header">
      <span class="section-tag">分类</span>
      <h2 class="section-title">Categories</h2>
    </div>
    <div class="card-grid">
      <div class="glass-card">
        <div class="card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </div>
        <h3>Category A</h3>
        <p>Content description placeholder</p>
      </div>
      <div class="glass-card">
        <div class="card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h3>Category B</h3>
        <p>Content description placeholder</p>
      </div>
      <div class="glass-card">
        <div class="card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <h3>Category C</h3>
        <p>Content description placeholder</p>
      </div>
      <div class="glass-card">
        <div class="card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </div>
        <h3>Category D</h3>
        <p>Content description placeholder</p>
      </div>
    </div>
  </section>

  <footer class="footer-glass">
    <p>&copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
